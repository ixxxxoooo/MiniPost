<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniPost 设计稿 · 可交互原型</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { font: 12px/1.4 var(--font-ui); background: #1b1c22; color: #e9eaf0; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  body:not(.static) { background:
    radial-gradient(1100px 600px at 15% -10%, #4a4fd633, transparent 60%),
    radial-gradient(900px 500px at 100% 100%, #d6336c22, transparent 60%), #15161b; }
  #bar { position: sticky; top: 0; z-index: 200; height: 52px; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: rgba(21, 22, 27, .82); backdrop-filter: blur(18px) saturate(1.4); border-bottom: 1px solid #ffffff14; }
  #bar { gap: 12px; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
  #bar > * { flex: none; }
  #bar .b-nav { display: flex; gap: 12px; margin-left: auto; }
  #bar label { color: #9a9fb2; font-size: 11px; margin-right: 6px; }
  .b-brand { display: flex; align-items: center; gap: 8px; --ac: #8c8fff; }
  .b-brand b { font-size: 13px; letter-spacing: -.01em; } .b-brand span { color: #9a9fb2; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #ffffff10; }
  .b-grp { display: flex; align-items: center; }
  .b-seg { display: inline-flex; padding: 2px; gap: 2px; background: #ffffff0f; border-radius: 9px; position: relative; }
  .b-seg button { height: 24px; padding: 0 10px; border: 0; border-radius: 7px; background: none; color: #b3b7c8; font: inherit; font-weight: 550; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all .15s; white-space: nowrap; }
  .b-seg button:hover { color: #fff; } .b-seg button.on { background: #fff; color: #15161b; box-shadow: 0 1px 3px #0006; }
  .b-seg button i { font-style: normal; font-weight: 800; font-size: 10px; opacity: .6; }
  .b-seg em { font-style: normal; font-size: 9.5px; padding: 0 5px; border-radius: 6px; background: #4cd69433; color: #4cd694; }
  .b-seg button.on em { background: #0a7d5022; color: #0a7d50; }
  .b-dots { display: inline-flex; gap: 7px; margin-right: 8px; }
  .b-dots button { width: 18px; height: 18px; border-radius: 50%; border: 0; background: var(--c); cursor: pointer; position: relative; box-shadow: inset 0 0 0 1px #ffffff30; transition: transform .15s cubic-bezier(.34,1.4,.64,1); }
  .b-dots button:hover { transform: scale(1.2); } .b-dots button.on::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid #fff; }
  .b-ic { width: 26px; height: 26px; border-radius: 8px; border: 0; background: #ffffff0f; color: #e9eaf0; cursor: pointer; display: grid; place-items: center; } .b-ic:hover { background: #ffffff1c; }
  #bar select { height: 26px; border-radius: 8px; border: 1px solid #ffffff1a; background: #ffffff0d; color: #e9eaf0; font: inherit; padding: 0 8px; max-width: 190px; outline: 0; }
  #bar select option, #bar select optgroup { background: #22232a; color: #e9eaf0; }
  .b-btn { height: 26px; padding: 0 11px; border-radius: 8px; border: 1px solid #ffffff1a; background: #ffffff0d; color: #e9eaf0; font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; } .b-btn:hover { background: #ffffff1a; }
  .b-n { display: none; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #8c8fff; color: #0f1030; font-size: 10px; font-weight: 700; place-items: center; }
  .b-nav { display: flex; gap: 14px; } .b-nav a { color: #b3b7c8; text-decoration: none; font-weight: 550; } .b-nav a:hover { color: #fff; }
  #stage { display: grid; place-items: start center; padding: 14px 24px 0; }
  #scaler { transform-origin: top left; }
  body.static #bar { display: none; }
  body.static #stage { padding: 0; display: block; } body.static { overflow: hidden; }
  #dec { position: fixed; z-index: 300; top: 58px; left: 50%; transform: translateX(-50%); width: 640px; padding: 6px 14px 12px; background: rgba(28, 29, 36, .96); backdrop-filter: blur(24px); border: 1px solid #ffffff1c; border-radius: 14px; box-shadow: 0 24px 60px #000a; animation: dd .22s cubic-bezier(.2,.8,.2,1); }
  @keyframes dd { from { opacity: 0; transform: translate(-50%, -8px) scale(.98); } }
  .d-h { display: flex; align-items: center; gap: 10px; padding: 8px 0 8px; border-bottom: 1px solid #ffffff12; } .d-h span { color: #9a9fb2; flex: 1; font-size: 11px; }
  .d-h button { height: 24px; padding: 0 10px; border-radius: 7px; border: 1px solid #ffffff1a; background: #ffffff0d; color: #e9eaf0; font: inherit; cursor: pointer; } .d-h .x { width: 24px; padding: 0; }
  .d-r { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #ffffff0d; } .d-r:last-child { border: 0; }
  .d-t { flex: 1; } .d-t b { display: block; font-size: 12.5px; } .d-t span { color: #9a9fb2; font-size: 11px; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"><div id="scaler"><div class="win" id="win" data-dir="a" data-scheme="mist" data-mode="light"><div id="app" style="display:contents"></div><div id="ov"></div><div id="pp"></div><div id="ts" class="toasts"></div></div></div></div>
<script src="assets/icons.js"></script>
<script src="assets/data.js"></script>
<script src="assets/logos.js"></script>
<script src="assets/app.js"></script>
<script src="assets/overlays.js"></script>
<script src="assets/screens.js"></script>
</body>
</html>
