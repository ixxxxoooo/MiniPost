name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 运行 Go 测试
        run: go test ./...

      - name: 运行 Go vet
        run: go vet ./...

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行前端测试
        run: npm test

      - name: 前端类型检查与构建
        run: npm run build
